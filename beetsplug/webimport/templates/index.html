<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beets Web Import</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>🎵 Beets Web Import</h1>
    </header>

    <main>
        <!-- Import Start Panel -->
        <section id="start-panel" class="panel">
            <h2>Import Music</h2>

            <!-- Drag and Drop Zone -->
            <div id="drop-zone" class="drop-zone">
                <div class="drop-zone-content">
                    <div class="drop-zone-icon">📂</div>
                    <p class="drop-zone-text">Drag &amp; drop a folder of music here</p>
                    <p class="drop-zone-hint">or use the path input below</p>
                </div>
                <div id="upload-progress" class="upload-progress hidden">
                    <div class="upload-progress-bar"><div id="upload-bar" class="upload-bar"></div></div>
                    <span id="upload-status">Uploading...</span>
                </div>
            </div>

            <div class="separator"><span>or enter a server path</span></div>

            <div class="input-group">
                <input type="text" id="import-path" placeholder="/path/to/music/folder">
                <button id="start-btn" onclick="startImport()">Import</button>
            </div>
        </section>

        <!-- Import Progress Panel -->
        <section id="progress-panel" class="panel hidden">
            <h2 id="progress-title">Importing...</h2>
            <div id="status-bar" class="status-bar">
                <span id="status-text">Waiting for import to start...</span>
            </div>

            <!-- Question Area -->
            <div id="question-area" class="hidden"></div>

            <!-- Log -->
            <div id="log-area">
                <h3>Import Log</h3>
                <div id="log-messages"></div>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
